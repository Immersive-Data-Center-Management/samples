services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  aas-environment:
    image: eclipsebasyx/aas-environment:2.0.0-milestone-15
    environment:
      SERVER_PORT: "8081"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/BaSyx
      BASYX_FEATURE_AUTHORIZATION_ENABLED: "true"
      BASYX_FEATURE_AUTHORIZATION_TYPE: rbac
      BASYX_FEATURE_AUTHORIZATION_JWTBEARERTOKENPROVIDER: keycloak
      BASYX_FEATURE_AUTHORIZATION_RBAC_FILE: file:/config/rbac_rules.json
    ports:
      - "8081:8081"
    volumes:
      - ./basyx/rbac_rules.json:/config/rbac_rules.json:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  assets:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./assets:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  seed:
    image: python:3.12-alpine
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      AAS_URL: http://aas-environment:8081
      ASSET_BASE_URL: ${ASSET_BASE_URL:-http://127.0.0.1:8080}
    volumes:
      - ./seed:/seed:ro
    command: ["python", "/seed/seed.py"]
    depends_on:
      keycloak:
        condition: service_healthy
      aas-environment:
        condition: service_started
    restart: "no"
