# Images are pinned by tag (readable) and digest (reproducible). To update one, pull the new tag and
# copy its digest: docker pull <image>:<tag> && docker inspect --format '{{index .RepoDigests 0}}' <image>:<tag>
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  aas-environment:
    image: eclipsebasyx/aas-environment:2.0.0-milestone-15@sha256:313da867059233e3c07e17a8ac21153a1f8fa0d02eada4e6b1b9f9e86afbd321
    environment:
      SERVER_PORT: "8081"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/BaSyx
      BASYX_FEATURE_AUTHORIZATION_ENABLED: "true"
      BASYX_FEATURE_AUTHORIZATION_TYPE: rbac
      BASYX_FEATURE_AUTHORIZATION_JWTBEARERTOKENPROVIDER: keycloak
      BASYX_FEATURE_AUTHORIZATION_RBAC_FILE: file:/config/rbac_rules.json
    ports:
      - "8081:8081"
    volumes:
      - ./basyx/rbac_rules.json:/config/rbac_rules.json:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  assets:
    image: nginx:1.30-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    ports:
      - "8080:80"
    volumes:
      - ./assets:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  seed:
    image: python:3.15-alpine@sha256:0aa144e9ec2ae8fd80dfd94070ef3e432a0df17b6e5e0091dc05323974ce9913
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      AAS_URL: http://aas-environment:8081
      ASSET_BASE_URL: ${ASSET_BASE_URL:-http://127.0.0.1:8080}
    volumes:
      - ./seed:/seed:ro
    command: ["python", "/seed/seed.py"]
    depends_on:
      keycloak:
        condition: service_healthy
      aas-environment:
        condition: service_started
    restart: "no"
